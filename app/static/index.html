<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Refinement Platform</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="panel topbar">
        <h1>AI推敲プラットフォーム</h1>
        <p class="hint">
          画面を分割しました。まず組織設計を決めてから実行設定へ進み、結果画面で進捗と出力を確認できます。
        </p>
        <nav class="view-tabs" aria-label="画面切り替え">
          <button type="button" class="view-tab is-active" data-screen="team">1. 組織設計</button>
          <button type="button" class="view-tab" data-screen="run">2. 実行設定</button>
          <button type="button" class="view-tab" data-screen="result">3. 実行ログ・結果</button>
        </nav>
      </header>

      <form id="refineForm" class="screen-host">
        <section class="screen-panel panel is-active" data-screen="team" id="screenTeam">
          <h2>1. 組織設計</h2>

          <section class="org-box">
            <h3>組織テンプレート</h3>
            <p class="org-note">
              用途ごとにチーム構成をテンプレート化し、保存して再利用できます。
            </p>

            <div class="tool-row">
              <label class="inline-field">
                テンプレート
                <select id="presetSelect"></select>
              </label>
              <button type="button" id="applyPresetBtn" class="tool-btn">テンプレート適用</button>
            </div>

            <div class="tool-row">
              <label class="inline-field">
                保存名
                <input id="profileNameInput" type="text" placeholder="例: Backend設計レビュー班" />
              </label>
              <button type="button" id="saveProfileBtn" class="tool-btn">現在構成を保存</button>
            </div>

            <div class="tool-row">
              <label class="inline-field">
                保存済み構成
                <select id="savedProfileSelect"></select>
              </label>
              <button type="button" id="loadProfileBtn" class="tool-btn">読込</button>
              <button type="button" id="deleteProfileBtn" class="remove-btn">削除</button>
            </div>
          </section>

          <div class="agents-header">
            <h3>エージェント設定</h3>
            <button type="button" id="addAgentBtn">+ 追加 (最大5)</button>
          </div>

          <div id="agentList" class="agent-list"></div>

          <div class="screen-actions">
            <button type="button" id="toRunFromTeam" class="tool-btn">次へ: 実行設定</button>
          </div>
        </section>

        <section class="screen-panel panel" data-screen="run" id="screenRun">
          <h2>2. 実行設定</h2>

          <label>
            モード
            <select id="workflowMode">
              <option value="writing">writing（文章推敲）</option>
              <option value="coding">coding（実装/設計）</option>
            </select>
          </label>

          <label>
            元テキスト
            <textarea id="sourceText" rows="9" required placeholder="推敲したい文章を入力"></textarea>
          </label>

          <label>
            目的
            <input id="objective" type="text" placeholder="例: 提案メールとして通りやすくする" />
          </label>

          <label>
            全体指示
            <textarea
              id="globalInstruction"
              rows="4"
              placeholder="例: 丁寧語、300字以内、具体例を1つ入れる"
            ></textarea>
          </label>

          <label>
            ラウンド数 (1-5)
            <input id="rounds" type="number" min="1" max="5" value="1" />
          </label>

          <section id="codingFields" class="coding-box" hidden>
            <h3>コーディングコンテキスト</h3>
            <label>
              リポジトリ名 / 機能名
              <input id="repoName" type="text" placeholder="例: payment-service / checkout-v2" />
            </label>
            <label>
              対象ファイル・ディレクトリ（改行 or カンマ区切り）
              <textarea id="targetPaths" rows="3" placeholder="例: src/api/orders.ts\nsrc/domain/payment/"></textarea>
            </label>
            <label>
              技術スタック・制約
              <textarea id="techStack" rows="3" placeholder="例: FastAPI + PostgreSQL, Python 3.13, 既存設計準拠"></textarea>
            </label>
            <label>
              受け入れ条件
              <textarea id="acceptanceCriteria" rows="4" placeholder="例: 1) 不正入力で400 2) 既存テストが通る 3) レスポンス互換"></textarea>
            </label>
            <label>
              テストコマンド
              <input id="testCommand" type="text" placeholder="例: pytest -q" />
            </label>
          </section>

          <div class="screen-actions">
            <button type="button" id="toTeamFromRun" class="tool-btn">戻る: 組織設計</button>
            <button id="runBtn" class="run" type="submit">推敲を実行</button>
            <button type="button" id="toResultFromRun" class="tool-btn">結果画面へ</button>
          </div>
        </section>
      </form>

      <section class="screen-panel panel result-panel" data-screen="result" id="screenResult">
        <h2>3. 実行ログ・結果</h2>
        <div id="status" class="status">待機中</div>

        <h3>最終稿</h3>
        <pre id="finalText" class="block empty">ここに最終稿が表示されます</pre>

        <h3>差分</h3>
        <pre id="diffText" class="block empty">ここに差分が表示されます</pre>

        <h3>会話ログ</h3>
        <div id="roundLog" class="round-log"></div>

        <div class="screen-actions">
          <button type="button" id="toTeamFromResult" class="tool-btn">組織設計へ</button>
          <button type="button" id="toRunFromResult" class="tool-btn">実行設定へ</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
